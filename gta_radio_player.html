<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GTA Radio - Sintonizador Local Directo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --card-active: #2b2314;
      --accent: #ffb300;
      --text: #ffffff;
      --text-muted: #aaaaaa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 1rem 1.5rem;
      background: #181818;
      border-bottom: 2px solid #282828;
    }
    h1 {
      font-size: 1.3rem;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .player-banner {
      background: #222;
      border: 2px solid var(--accent);
      border-radius: 12px;
      margin: 1rem 1.5rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .player-banner h2 {
      font-size: 1.1rem;
      color: var(--accent);
    }
    audio {
      width: 100%;
      height: 40px;
      border-radius: 8px;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 0 1.5rem 1rem;
      display: grid;
      gap: 0.75rem;
    }
    .station-card {
      background: var(--card-bg);
      border: 1px solid #282828;
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s;
    }
    .station-card:hover {
      border-color: #444;
      transform: translateY(-1px);
    }
    .station-card.active {
      background: var(--card-active);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(255, 179, 0, 0.15);
    }
    .station-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
    }
    .station-card.active .station-name {
      color: var(--accent);
    }
    .station-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .status-badge {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--accent);
      background: rgba(255, 179, 0, 0.15);
      border: 1px solid var(--accent);
      padding: 4px 10px;
      border-radius: 6px;
      display: none;
    }
    .station-card.active .status-badge {
      display: inline-block;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .github-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #24292e;
      color: #fff;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 6px 12px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .github-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(255, 179, 0, 0.35);
    }
    .github-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--accent);
    }
    .github-handle {
      color: var(--accent);
      font-size: 0.72rem;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-row">
      <div>
        <h1>GTA Radio Live Tuner</h1>
        <div class="subtitle">Reproductor con control de volumen · git: github.com/emmahiguita/Radio-Gta</div>
      </div>
      <a class="github-btn" href="https://github.com/emmahiguita/Radio-Gta" target="_blank" rel="noopener noreferrer" title="Ir al GitHub de @emmahiguita">
        <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12C2,16.42 4.87,20.17 8.84,21.5C9.34,21.58 9.5,21.27 9.5,21C9.5,20.77 9.5,20.14 9.5,19.31C6.73,19.91 6.14,17.97 6.14,17.97C5.68,16.81 5.03,16.5 5.03,16.5C4.12,15.88 5.1,15.9 5.1,15.9C6.1,15.97 6.63,16.93 6.63,16.93C7.5,18.45 8.97,18 9.54,17.76C9.63,17.11 9.89,16.67 10.17,16.42C7.95,16.17 5.62,15.31 5.62,11.5C5.62,10.39 6,9.5 6.65,8.79C6.55,8.54 6.2,7.5 6.75,6.15C6.75,6.15 7.59,5.88 9.5,7.17C10.29,6.95 11.15,6.84 12,6.84C12.85,6.84 13.71,6.95 14.5,7.17C16.41,5.88 17.25,6.15 17.25,6.15C17.8,7.5 17.45,8.54 17.35,8.79C18,9.5 18.38,10.39 18.38,11.5C18.38,15.32 16.04,16.16 13.81,16.41C14.17,16.72 14.5,17.33 14.5,18.26C14.5,19.6 14.5,20.68 14.5,21C14.5,21.27 14.66,21.59 15.17,21.5C19.14,20.16 22,16.42 22,12A10,10 0 0,0 12,2Z"/></svg>
        <div>
          GitHub
          <span class="github-handle">@emmahiguita</span>
        </div>
      </a>
    </div>
  </header>

  <div class="player-banner">
    <div>
      <h2 id="currentName">Flash FM (Emisora Completa Original)</h2>
      <div class="subtitle" id="currentMeta">GTA Vice City · Pop / 80s Hits (DJ Toni)</div>
    </div>
    <!-- Reproductor nativo visible con barra de progreso y volumen -->
    <audio id="nativeAudio" controls autoplay src="https://archive.org/download/gtavcrs/Flash%20FM.mp3"></audio>
  </div>

  <main id="stationsList"></main>

  <script>
    const STATIONS = [
      { id: "head_radio", name: "Head Radio", gameTitle: "GTA III", genre: "Soft Rock / Pop (Michael Hunt)", url: "https://archive.org/download/gta3rs/Head%20Radio.mp3" },
      { id: "flash_fm", name: "Flash FM", gameTitle: "GTA Vice City", genre: "Pop 80s (DJ Toni)", url: "https://archive.org/download/gtavcrs/Flash%20FM.mp3" },
      { id: "vrock", name: "V-Rock", gameTitle: "GTA Vice City", genre: "Heavy Metal / Hard Rock (Lazlow)", url: "https://archive.org/download/gtavcrs/V-Rock.mp3" },
      { id: "kdst", name: "K-DST", gameTitle: "GTA San Andreas", genre: "Classic Rock (Tommy 'The Nightmare' Smith)", url: "https://archive.org/download/gtasars/K-DST.mp3" },
      { id: "radio_los_santos", name: "Radio Los Santos", gameTitle: "GTA San Andreas", genre: "West Coast Hip-Hop (Julio G)", url: "https://archive.org/download/gtasars/Radio%20Los%20Santos.mp3" },
      { id: "vladivostok", name: "Vladivostok FM", gameTitle: "GTA IV", genre: "Eastern European Dance (Ruslana)", url: "https://archive.org/download/gta-iv-radio/Vladivostok%20FM.mp3" },
      { id: "liberty_rock", name: "Liberty Rock Radio", gameTitle: "GTA IV", genre: "Classic Rock (Iggy Pop)", url: "https://archive.org/download/gta-iv-radio/Liberty%20Rock%20Radio.mp3" },
      { id: "los_santos_rock", name: "Los Santos Rock Radio", gameTitle: "GTA V", genre: "Classic Rock (Kenny Loggins)", url: "https://archive.org/download/gtaradio-audio-collection/los_santos_rock_radio.mp3" },
      { id: "non_stop_pop", name: "Non-Stop-Pop FM", gameTitle: "GTA V", genre: "Pop / Dance (Cara Delevingne)", url: "https://archive.org/download/gtaradio-audio-collection/non-stop-pop_fm.mp3" }
    ];

    const audio = document.getElementById("nativeAudio");
    const currentName = document.getElementById("currentName");
    const currentMeta = document.getElementById("currentMeta");
    const stationsList = document.getElementById("stationsList");
    let currentId = "flash_fm";

    audio.volume = 1.0;

    function renderStations() {
      stationsList.innerHTML = "";
      STATIONS.forEach(station => {
        const card = document.createElement("div");
        card.className = "station-card" + (currentId === station.id ? " active" : "");
        card.innerHTML = `
          <div>
            <div class="station-name">${station.name}</div>
            <div class="station-meta">${station.gameTitle} · ${station.genre}</div>
          </div>
          <div class="status-badge">REPRODUCIENDO</div>
        `;
        card.onclick = () => {
          currentId = station.id;
          currentName.textContent = station.name;
          currentMeta.textContent = `${station.gameTitle} · ${station.genre}`;
          audio.src = station.url;
          audio.play();
          renderStations();
        };
        stationsList.appendChild(card);
      });
    }

    renderStations();
  </script>
</body>
</html>
